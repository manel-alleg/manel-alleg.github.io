<section class="steps" aria-label="Pour nous rejoindre">
  <div class="steps-card">
    <h2>Pour nous rejoindre</h2>
    <p class="steps-subtitle">C’est simple comme 1, 2, 3</p>

    <div class="steps-grid">
      <article class="step" data-step="1">
        <span class="step-number">1</span>
        <p>Rejoignez la communauté Orbit.</p>
      </article>
      <article class="step" data-step="2">
        <span class="step-number">2</span>
        <p>Choisissez la solution qui vous correspond</p>
      </article>
      <article class="step" data-step="3">
        <span class="step-number">3</span>
        <p>Avancez plus vite vers vos objectifs</p>
      </article>
    </div>

    <div class="steps-line">
      <span class="steps-line-progress"></span>
      <span class="steps-line-arrow">→</span>
    </div>

    <p class="steps-quote">
      “Le premier pas vers le succès c’est d’entrer dans la bonne communauté”
    </p>
  </div>
</section>

<style>
  @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap");

  .steps {
    font-family: "Space Grotesk", "Inter", "Segoe UI", system-ui, sans-serif;
    padding: 48px 20px 64px;
    background: #ffffff;
    display: flex;
    justify-content: center;
  }

  .steps-card {
    width: min(980px, 100%);
    background: radial-gradient(circle at top, #2b1b74 0%, #120a3a 60%, #0b0830 100%);
    border-radius: 24px;
    color: #ffffff;
    padding: 36px 40px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .steps-card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    pointer-events: none;
  }

  .steps-card h2 {
    font-size: clamp(22px, 3vw, 30px);
    margin-bottom: 6px;
  }

  .steps-subtitle {
    font-weight: 600;
    margin-bottom: 24px;
    color: rgba(255, 255, 255, 0.8);
  }

  .steps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    text-align: left;
    margin-bottom: 18px;
  }

  .step {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px;
    align-items: center;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .step-number {
    font-size: 32px;
    font-weight: 700;
    color: #ffc400;
  }

  .steps-line {
    position: relative;
    height: 2px;
    background: rgba(255, 255, 255, 0.2);
    margin: 18px 12px 20px;
  }

  .steps-line-progress {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0;
    background: #ffffff;
    transition: width 0.9s ease;
  }

  .steps-line-arrow {
    position: absolute;
    right: 0;
    top: -10px;
    font-size: 18px;
    color: #ffffff;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .steps-quote {
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    margin: 0;
  }

  .steps-card.is-active .step[data-step="1"] {
    opacity: 1;
    transform: translateY(0);
    transition-delay: 0.1s;
  }

  .steps-card.is-active .step[data-step="2"] {
    opacity: 1;
    transform: translateY(0);
    transition-delay: 0.45s;
  }

  .steps-card.is-active .step[data-step="3"] {
    opacity: 1;
    transform: translateY(0);
    transition-delay: 0.8s;
  }

  .steps-card.is-active .steps-line-progress {
    width: 100%;
    transition-delay: 0.8s;
  }

  .steps-card.is-active .steps-line-arrow {
    opacity: 1;
    transition-delay: 1.3s;
  }

  @media (max-width: 640px) {
    .steps-card {
      padding: 28px 20px 32px;
      text-align: center;
    }

    .steps-grid {
      text-align: center;
    }

    .step {
      grid-template-columns: 1fr;
      justify-items: center;
    }
  }
</style>

<script>
  (() => {
    const card = document.querySelector(".steps-card");
    if (!card) return;

    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          card.classList.add("is-active");
          observer.disconnect();
        }
      },
      { threshold: 0.4 }
    );

    observer.observe(card);
  })();
</script>
