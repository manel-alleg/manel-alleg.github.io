<section class="clients" aria-label="Nos clients">
  <h2>Nos clients</h2>
  <p>Ils nous font confiance pour grandir avec eux.</p>
  <div class="clients-marquee" aria-hidden="true">
    <div class="clients-track">
      <img
        src="https://assets.zyrosite.com/tPWPZ3kEpjHdFO9F/group-2085662434-axStHKXsz2am16hi.png"
        alt="Logos de nos clients"
        loading="lazy"
      />
      <img
        src="https://assets.zyrosite.com/tPWPZ3kEpjHdFO9F/group-2085662434-axStHKXsz2am16hi.png"
        alt="Logos de nos clients"
        loading="lazy"
      />
    </div>
  </div>
</section>

<style>
  @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap");

  .clients {
    font-family: "Space Grotesk", "Inter", "Segoe UI", system-ui, sans-serif;
    background: #ffffff;
    padding: 48px 20px 64px;
    text-align: center;
    color: #0b0d2c;
  }

  .clients h2 {
    font-size: clamp(22px, 2.8vw, 30px);
    margin-bottom: 8px;
  }

  .clients p {
    color: #1c2370;
    margin-bottom: 24px;
  }

  .clients-marquee {
    max-width: 820px;
    margin: 0 auto;
    padding: 16px 0;
    border-radius: 16px;
    background: #f7f7fb;
    box-shadow: 0 12px 24px rgba(14, 17, 64, 0.08);
    overflow: hidden;
    opacity: 0;
    transform: translateY(16px) scale(0.98);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .clients-track {
    display: inline-flex;
    align-items: center;
    gap: 32px;
    padding: 0 24px;
    animation: marquee 18s linear infinite;
  }

  .clients-track img {
    width: 720px;
    height: auto;
    display: block;
  }

  .clients.is-visible .clients-marquee {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  @keyframes marquee {
    0% {
      transform: translateX(0);
    }
    100% {
      transform: translateX(-50%);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .clients-track {
      animation: none;
    }
  }
</style>

<script>
  (() => {
    const section = document.querySelector(".clients");
    if (!section) return;

    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          section.classList.add("is-visible");
          observer.disconnect();
        }
      },
      { threshold: 0.3 }
    );

    observer.observe(section);
  })();
</script>
